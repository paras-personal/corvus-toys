<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting | CorVus Toys</title>
  <!-- Legacy product.html?id= links now live at /products/<id>.html -->
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get("id");
      var known = [
        "addie-girl", "addie-boy", "baby-balance-bike", "remote-control-car",
        "pop-it-fidget", "baby-panda-keychain", "goku-keychain", "labubu-charm"
      ];
      window.location.replace(
        id && known.indexOf(id) !== -1 ? "/products/" + id + ".html" : "/#products"
      );
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/#products"></noscript>
</head>
<body>
  <p>This page has moved. <a href="/#products">Browse all CorVus Toys</a>.</p>
</body>
</html>
