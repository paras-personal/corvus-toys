<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | CorVus Toys</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .lost-page {
      min-height: 70vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 60px 24px;
    }
    .lost-page span { font-size: 4rem; display: block; margin-bottom: 16px; }
    .lost-page h1 { font-size: clamp(2rem, 5vw, 3rem); }
    .lost-page p { color: var(--ink-soft); max-width: 420px; margin: 0 auto 28px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="/" aria-label="CorVus Toys home">
        <img src="/assets/logo.png" alt="CorVus Toys logo" width="56" height="56">
        <span class="brand__name">CorVus <em>Toys</em></span>
      </a>
    </div>
  </header>

  <main class="lost-page">
    <div>
      <span aria-hidden="true">🧸</span>
      <h1>Oops, this toy wandered off!</h1>
      <p>The page you are looking for may have moved or the link may be outdated. Head back to the shelf and browse the full collection.</p>
      <a class="button button--primary" href="/#products">Browse all toys</a>
    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-note">&copy; 2026 CorVus Toys. All rights reserved.</p>
  </footer>
</body>
</html>
